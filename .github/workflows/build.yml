name: Build Custom PS1 BIOS

on:
  workflow_dispatch:

jobs:
  build:
    name: "Build BIOS"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Build with Docker
        run: |
          docker run --rm -v $PWD:/src -w /src ghcr.io/grumpycoders/pcsx-redux-build:latest \
          bash -c "make clean && make"

      - name: Upload BIOS artifact
        uses: actions/upload-artifact@v4
        with:
          name: custom-ps1-bios
          path: custom.bios
