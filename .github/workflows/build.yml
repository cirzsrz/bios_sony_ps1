name: Build Custom PS1 BIOS

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Install system toolchain (simpler, no Docker issues)
      run: |
        sudo apt-get update
        sudo apt-get install -y gcc-mipsel-linux-gnu binutils-mipsel-linux-gnu python3

    - name: Build BIOS
      run: |
        make clean
        make

    - name: Upload BIOS artifact
      uses: actions/upload-artifact@v4
      with:
        name: custom-ps1-bios
        path: custom.bios
