name: Build Custom PS1 BIOS

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Install real PS1 toolchain
      run: |
        sudo apt-get update
        sudo apt-get install -y build-essential git python3
        git clone https://github.com/JaCzekanski/openbios-build.git
        cd openbios-build
        ./build-toolchain.sh
        echo "$(pwd)/mipsel-unknown-elf/bin" >> $GITHUB_PATH

    - name: Build BIOS
      run: |
        make clean
        make

    - name: Upload BIOS artifact
      uses: actions/upload-artifact@v4
      with:
        name: custom-ps1-bios
        path: custom.bios
