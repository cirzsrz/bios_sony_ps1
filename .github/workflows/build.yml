name: Build Custom PS1 BIOS

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Build with PCSX-Redux Docker (official method)
      run: |
        docker run --rm \
          -v $PWD:/src \
          -w /src \
          --entrypoint /bin/bash \
          ghcr.io/grumpycoders/pcsx-redux-build:latest \
          -c ". /etc/profile && cd /src && make -f Makefile.docker"

    - name: Upload BIOS artifact
      uses: actions/upload-artifact@v4
      with:
        name: custom-ps1-bios
        path: custom.bios
